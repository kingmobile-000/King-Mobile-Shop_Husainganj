function rcDone(o){ask("✅ Recharge Done करें? ("+(o.no||"")+")",function(){var f={dboy:me,cancelby:"",upd:new Date().toISOString()};ov[o.id]="Done";lset(OK,ov);post({action:"status",id:o.id,status:"Done",fields:f});rcLog(o,"Done");render();setTimeout(fetchAll,4000)})}
function rcCancel(o){var b=document.getElementById("shb"),Q=["2-3 बार गए, ग्राहक नहीं मिला","फ़ोन बंद / नहीं उठा रहा","नंबर गलत है","ग्राहक ने मना किया","नेटवर्क / बैलेंस की दिक्कत"];
b.innerHTML='<h3>❌ रिचार्ज रद्द ('+esc(o.no||"")+')</h3><div style="font-size:13px;color:#555;margin-bottom:6px">कारण लिखिए (ज़रूरी)</div><div class="qk">'+Q.map(function(q,i){return '<button type="button" data-q="'+i+'">'+esc(q)+'</button>'}).join("")+'</div><textarea class="rcr" id="rcrt" placeholder="जैसे: 3 बार गए, ग्राहक घर पर नहीं मिला"></textarea><div id="rce" style="color:#c0160c;font-weight:800;font-size:13px;min-height:18px"></div><div class="r"><button style="background:#eee" id="rcn">वापस</button><button style="background:#b42410;color:#fff" id="rcy">रिचार्ज रद्द करें</button></div>';
document.getElementById("ov").classList.add("on");
[].forEach.call(b.querySelectorAll("[data-q]"),function(x){x.onclick=function(){document.getElementById("rcrt").value=Q[+x.getAttribute("data-q")]}});
document.getElementById("rcn").onclick=function(){document.getElementById("ov").classList.remove("on")};
document.getElementById("rcy").onclick=function(){var r=document.getElementById("rcrt").value.trim();if(r.length<3){document.getElementById("rce").textContent="⚠ रद्द करने का कारण लिखिए";return}
document.getElementById("ov").classList.remove("on");var nt=(String(o.note||"")+" | रद्द कारण (डिलीवरी बॉय): "+r).trim(),f={dboy:me,cancelby:"Boy",note:nt,upd:new Date().toISOString()};
o.note=nt;o.cancelby="Boy";rcr[o.id]=r;lset(RCK,rcr);ov[o.id]="Cancelled";lset(OK,ov);post({action:"status",id:o.id,status:"Cancelled",fields:f});rcLog(o,"Cancelled",r);render();setTimeout(fetchAll,4000)}}
document.getElementById("app").addEventListener("click",function(e){var b=e.target.closest("[data-rs]");if(!b)return;var o=rcFind(b.getAttribute("data-id"));if(!o)return;if(b.getAttribute("data-rs")==="Done")rcDone(o);else rcCancel(o)});
try{render()}catch(e){}
</script>

</body></html>
